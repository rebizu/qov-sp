name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # golden corpus + cross-implementation (TS, C, C#); needs gcc (preinstalled)
      - name: Conformance
        run: npm run conformance

      # QOV-S transport / playback gate / adaptation ladder
      - name: Streaming self-test
        run: npm run selftest

      # randomized differential fuzz + regression repros
      - name: Review suite
        run: npm run review
