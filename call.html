<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QOV-S 1:1 Call Demo</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif; background: #12141a; color: #e8eaf0;
      margin: 0; padding: 24px; max-width: 1100px; margin-inline: auto;
    }
    h1 { font-size: 1.3rem; margin: 0 0 4px; }
    .sub { color: #9aa3b5; font-size: 0.85rem; margin-bottom: 20px; }
    .bar { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
    button, select, input[type="text"] {
      background: #232838; color: #e8eaf0; border: 1px solid #3a4156; border-radius: 8px;
      padding: 8px 14px; font-size: 0.9rem;
    }
    button { border: 1px solid #3a4156; cursor: pointer; }
    button:hover { background: #2c3247; }
    button:disabled { opacity: 0.5; cursor: default; }
    button.active { background: #2f6feb; border-color: #2f6feb; }
    input[type="text"] { min-width: 240px; }
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 860px) { .panels { grid-template-columns: 1fr; } }
    .panel { background: #181b24; border: 1px solid #262c3b; border-radius: 12px; padding: 14px; }
    .panel h2 { font-size: 0.95rem; margin: 0 0 10px; color: #b7c0d4; }
    video { display: none; }
    canvas { width: 100%; background: #000; border-radius: 8px; aspect-ratio: 4/3; object-fit: contain; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-top: 10px;
             font-size: 0.8rem; color: #9aa3b5; font-variant-numeric: tabular-nums; }
    .stats b { color: #e8eaf0; font-weight: 600; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
    .badge.live { background: #1c4620; color: #7ee787; }
    .badge.frozen { background: #4d3a12; color: #f0c060; }
    .badge.waiting { background: #333a4c; color: #aab3c7; }
    .badge.off { background: #4d1c1c; color: #ff8f8f; }
    .controls { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; font-size: 0.85rem; }
    .controls label { display: flex; gap: 8px; align-items: center; color: #b7c0d4; }
    .log { margin-top: 10px; height: 110px; overflow-y: auto; font-size: 0.72rem; font-family: ui-monospace, monospace;
           color: #8fa0c0; background: #10131a; border-radius: 8px; padding: 8px; }
    .err { color: #ff8f8f; }
  </style>
</head>
<body>
  <h1>QOV-S 1:1 Call Demo</h1>
  <div class="sub">
    QOV-S v2.0 WebSocket binding (stream mode + simulated datagram loss).
    Open this page in two windows: one Host (sends the camera), one Guest (plays).
    Requires the relay: <code>npm run relay</code>. Wire protocol:
    <a href="spec.html?doc=streaming" style="color:#7dd3fc">QOV-S v2.1</a>.
  </div>

  <div class="bar" id="setup">
    <button id="btnHost">Host — send camera</button>
    <button id="btnGuest">Guest — view</button>
    <input type="text" id="relayUrl" />
    <label style="font-size:0.85rem; color:#b7c0d4; display:flex; gap:6px; align-items:center;">
      <input type="checkbox" id="micCheck" /> microphone (16 kHz speech)
      <select id="audioCodecSelect" title="speech codec (Opus needs WebCodecs; falls back to QOA)">
        <option value="qoa">QOA 69 kbps</option>
        <option value="opus">Opus ~24 kbps</option>
      </select>
    </label>
    <label style="font-size:0.85rem; color:#b7c0d4; display:flex; gap:6px; align-items:center;">
      <input type="checkbox" id="dtxCheck" checked />
      <span title="drop audio chunks during silence (Opus path only; keep-alive every ~400 ms)">silence suppression</span>
    </label>
    <span id="relayState" class="badge off">relay: not connected</span>
  </div>

  <div class="panels">
    <div class="panel" id="hostPanel" style="display:none">
      <h2>Host — sending</h2>
      <video id="cam" autoplay playsinline muted></video>
      <canvas id="hostCanvas" width="320" height="240"></canvas>
      <div class="stats" id="hostStats"></div>
      <div class="controls">
        <label>target FPS <input type="range" id="fpsSlider" min="5" max="30" value="24" /> <span id="fpsVal">24</span></label>
        <label>FEC group <select id="fecSelect">
          <option value="4">1:4 (light)</option>
          <option value="3">1:3 (aggressive)</option>
          <option value="0">off (NACK only)</option>
        </select></label>
        <label><button id="btnKeyframe">Force keyframe</button></label>
      </div>
      <div class="log" id="hostLog"></div>
    </div>

    <div class="panel" id="guestPanel" style="display:none">
      <h2>Guest — playing <span id="guestBadge" class="badge waiting">waiting</span></h2>
      <canvas id="guestCanvas" width="320" height="240"></canvas>
      <div class="stats" id="guestStats"></div>
      <div class="controls">
        <label>simulate datagram loss <input type="range" id="lossSlider" min="0" max="40" value="0" /> <span id="lossVal">0%</span></label>
      </div>
      <div class="log" id="guestLog"></div>
    </div>
  </div>

  <script type="module" src="/src/call.ts"></script>
</body>
</html>
