<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QOV Player</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .player-container {
            position: relative;
            background: #000;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16/9;
            margin: 0 auto;
            border: 1px solid #333;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            margin-top: 1rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Player</h1>
        <p class="subtitle">Stream QOV Playback</p>

        <div class="controls" style="margin-bottom: 1rem;">
            <button id="btnOpen">Open File</button>
        </div>

        <div class="player-container">
            <canvas id="canvas"></canvas>
        </div>

        <div class="controls">
            <button id="btnPlayPause">Play/Pause</button>
            <span id="timeDisplay">00:00</span>
        </div>

        <div style="margin-top: 2rem;">
            <a href="index.html" style="color: #64748b; text-decoration: none;">&larr; Back to Home</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const btnOpen = document.getElementById('btnOpen');
        const btnPlayPause = document.getElementById('btnPlayPause');

        let socket = null;
        let isPlaying = false;

        btnOpen.onclick = () => {
            // Request file via Photino Interop (native dialog)
            // Since we use WebSocket for data, we still need Interop for System Dialogs?
            // Or we can use <input type="file">? 
            // <input type="file"> gives a File object which browser can read.
            // But QovDecoder (C#) needs a file path to open it with FileStream.
            // Typically, browser cannot give full path.
            // Photino allows interop.
            window.external.sendMessage('openFile');
        };

        // Listen for messages from C# (e.g., "opened:path")
        window.external.receiveMessage(message => {
            if (message.startsWith('opened:')) {
                const parts = message.split(':'); // path might have colons
                // Actually C# should just say "Ready to stream".
                // Start WebSocket connection
                connectPlayer();
            }
        });

        function connectPlayer() {
            if (socket) socket.close();

            socket = new WebSocket('ws://localhost:8000/play');
            socket.binaryType = 'arraybuffer';

            socket.onopen = () => {
                console.log("Connected to Player Stream");
                isPlaying = true;
            };

            socket.onmessage = (event) => {
                // Received frame data
                // Protocol: First 8 bytes = width(4), height(4)? Or just raw RGBA?
                // For simplicity, let's assume we know dimensions or send a header first.
                // Assuming raw ARGB (or BGRA) buffer.

                const data = new Uint8Array(event.data);

                // If it's a small header packet (json)
                if (data.length < 1000) { // arbitrary text limit
                    try {
                        const text = new TextDecoder().decode(data);
                        const meta = JSON.parse(text);
                        if (meta.width) {
                            canvas.width = meta.width;
                            canvas.height = meta.height;
                            return;
                        }
                    } catch (e) { }
                }

                // Render Frame
                const imageData = new ImageData(new Uint8ClampedArray(data), canvas.width, canvas.height);
                ctx.putImageData(imageData, 0, 0); // Put raw pixels
            };
        }

        btnPlayPause.onclick = () => {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(isPlaying ? "pause" : "play");
                isPlaying = !isPlaying;
            }
        };

    </script>
</body>

</html>
