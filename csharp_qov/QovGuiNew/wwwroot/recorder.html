<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QOV Recorder</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .controls {
            margin: 1rem 0;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        #status {
            margin-top: 1rem;
            font-weight: bold;
            color: #00d4ff;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Recorder</h1>
        <p class="subtitle">Capture & Encode to QOV</p>

        <div class="preview-container">
            <video id="preview" autoplay muted playsinline></video>
        </div>

        <div id="status">Ready</div>

        <div class="controls">
            <button id="btnScreen">Record Screen</button>
            <button id="btnCamera">Record Camera</button>
            <button id="btnStop" disabled style="background: #ef4444;">Stop</button> <!-- Red for stop -->
        </div>

        <div style="margin-top: 1rem;">
            <a href="index.html" style="color: #64748b; text-decoration: none;">&larr; Back to Home</a>
        </div>
    </div>

    <script>
        const preview = document.getElementById('preview');
        const status = document.getElementById('status');
        const btnScreen = document.getElementById('btnScreen');
        const btnCamera = document.getElementById('btnCamera');
        const btnStop = document.getElementById('btnStop');

        let mediaStream = null;
        let mediaRecorder = null;
        let socket = null;
        let isRecording = false;

        async function startRecording(type) {
            try {
                if (type === 'screen') {
                    mediaStream = await navigator.mediaDevices.getDisplayMedia({
                        video: { cursor: "always" },
                        audio: false
                    });
                } else {
                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: false
                    });
                }

                preview.srcObject = mediaStream;

                // Connect WebSocket
                socket = new WebSocket('ws://localhost:8000/record');
                socket.binaryType = 'blob';

                socket.onopen = () => {
                    status.textContent = "Connected. Recording...";
                    isRecording = true;
                    updateButtons();

                    // Start MediaRecorder to get chunks
                    // We request DataAvailable every 16ms (approx 60fps) or 33ms (30fps)
                    // But MediaRecorder might not be precise. 
                    // Better verify latency. For QOV we want raw frames.
                    // MediaRecorder gives encoded chunks (WebM/VP9). 
                    // To get RAW frames for QOV encoding in C#, we have two options:
                    // 1. Send the WebM chunks and decode in C# (complex).
                    // 2. Draw to Canvas and send raw blobs (heavy JS, but "raw").
                    // The plan said "MediaRecorder API captures chunks... Sends Blob data directly".
                    // IF we send WebM chunks, QovEncoder needs to decode WebM? QovEncoder takes raw pixels.
                    // The PLAN update said: "Draw frames to an offscreen canvas, extracts Blob... and streams".
                    // Wait, the WebSocket update said: "MediaRecorder API captures chunks... Sends Blob data directly".
                    // Use ImageCapture or Canvas for raw frames is safer for QovEncoder.

                    // Let's use Canvas drawing loop for raw frames + WebSocket.
                    startFrameLoop();
                };

                socket.onerror = (e) => {
                    console.error(e);
                    status.textContent = "WebSocket Error";
                };

                socket.onclose = () => {
                    status.textContent = "Connection Closed";
                    stopRecordingInternal();
                };

            } catch (err) {
                console.error("Error: " + err);
                status.textContent = "Error: " + err.message;
            }
        }

        function startFrameLoop() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            // Set canvas size to video size
            const track = mediaStream.getVideoTracks()[0];
            const settings = track.getSettings();
            canvas.width = settings.width || preview.videoWidth;
            canvas.height = settings.height || preview.videoHeight;

            // Send header/metadata first? 
            // C# expects a stream. Let's send a JSON header first, then binary blobs.
            const header = JSON.stringify({
                width: canvas.width,
                height: canvas.height,
                fps: 30 // Target
            });
            socket.send(header);

            const interval = 1000 / 30; // 30 FPS target

            const loop = setInterval(() => {
                if (!isRecording || socket.readyState !== WebSocket.OPEN) {
                    clearInterval(loop);
                    return;
                }

                ctx.drawImage(preview, 0, 0, canvas.width, canvas.height);

                // Get raw pixels? Or Blob (JPEG/PNG)?
                // QovEncoder is fast. Receiving PNG/JPEG adds decode overhead in C#.
                // Raw RGBA is huge (1920x1080x4 = 8MB per frame! @ 30fps = 240MB/s). 
                // That might choke WebSocket/Loopback.
                // JPEG Blob is better. QOV can handle it if we decode in C# (Bitmap).
                // Let's send JPEG blobs. Fast to encode in Browser, fast to decode in .NET (System.Drawing/Skia).

                canvas.toBlob((blob) => {
                    if (socket.readyState === WebSocket.OPEN) {
                        socket.send(blob);
                    }
                }, 'image/jpeg', 0.85); // 85% Quality JPEG

            }, interval);
        }

        function stopRecording() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            if (socket) {
                socket.close(); // Close initiates finalize in C#
            }
            stopRecordingInternal();
        }

        function stopRecordingInternal() {
            isRecording = false;
            updateButtons();
            status.textContent = "Stopped. Saved.";
        }

        function updateButtons() {
            btnScreen.disabled = isRecording;
            btnCamera.disabled = isRecording;
            btnStop.disabled = !isRecording;
        }

        btnScreen.onclick = () => startRecording('screen');
        btnCamera.onclick = () => startRecording('camera');
        btnStop.onclick = stopRecording;

    </script>
</body>

</html>
